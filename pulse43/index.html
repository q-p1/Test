(()=>{const C=document.getElementById('g'),X=C.getContext('2d'),$=id=>document.getElementById(id);let W,H,D=1,last=0,state='menu',mode='endless',t=0,score=0,kills=0,combo=1,comboT=0,pulse=0,spawn=0,bossAt=25,boss=null,flash=0,shake=0,paused=0,drag=0,tx=0,ty=0,bul=[],eb=[],en=[],fx=[],orb=[],best=+(localStorage.p43best||0),cores=+(localStorage.p43cores||0),runs=+(localStorage.p43runs||0),earned=0;let p={x:0,y:0,r:13,hp:3,lv:1,xp:0,nxp:70,dmg:16,rate:.28,shot:0,speed:10,shield:0,dash:0,crit:.08,mult:1};let audio=null;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(D,0,0,D,0,0);if(state==='menu'){p.x=W/2;p.y=H*.62}}addEventListener('resize',resize);resize();function tone(f=360,d=.05,type='sine',v=.025){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}function toast(s){let e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.remove('on'),850)}function reset(){t=score=kills=earned=0;combo=1;comboT=pulse=spawn=0;bossAt=25;boss=null;bul=[];eb=[];en=[];fx=[];orb=[];p={x:W/2,y:H*.62,r:13,hp:3,lv:1,xp:0,nxp:70,dmg:16,rate:.28,shot:0,speed:10,shield:0,dash:0,crit:.08,mult:1};tx=p.x;ty=p.y;ui()}function start(){reset();state='play';$('screen').style.display='none';$('dead').style.display='none';$('levelup').style.display='none';last=performance.now();tone(330,.08,'triangle',.04);requestAnimationFrame(loop)}function end(){state='dead';runs++;best=Math.max(best,Math.floor(score));cores+=earned;localStorage.p43best=best;localStorage.p43cores=cores;localStorage.p43runs=runs;$('dscore').textContent=Math.floor(score);$('dkills').textContent=kills;$('dcores').textContent='+'+earned;$('deadText').textContent=mode==='blitz'&&t>=60?'Time. You survived the whole minute.':'The swarm finally collected its debt.';$('dead').style.display='grid';tone(120,.3,'sawtooth',.035);menuStats()}function menuStats(){$('menuBest').textContent=best;$('best').textContent=best;$('cores').textContent=cores;$('runs').textContent=runs}menuStats();document.querySelectorAll('.mode').forEach(b=>b.dataset.m&&(b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.mode[data-m]').forEach(x=>x.classList.toggle('active',x===b))}));$('start').onclick=start;$('again').onclick=start;$('home').onclick=()=>{state='menu';$('dead').style.display='none';$('screen').style.display='grid';menuStats()};function edge(){let s=Math.floor(Math.random()*4);return s==0?{x:-30,y:rand(30,H-30)}:s==1?{x:W+30,y:rand(30,H-30)}:s==2?{x:rand(30,W-30),y:-30}:{x:rand(30,W-30),y:H+30}}function enemy(big=0){let a=edge(),r=Math.random(),kind=big?'boss':r<.18?'tank':r<.34?'shooter':'chase',hp=big?430+t*7:kind==='tank'?48+t*.35:20+t*.23,enx={...a,kind,r:big?38:kind==='tank'?19:13,hp,max:hp,sp:big?35:kind==='tank'?32:kind==='shooter'?43:55,shoot:rand(1,2),dead:0};en.push(enx);if(big){boss=enx;$('boss').classList.add('show');toast('ANOMALY DETECTED');tone(95,.25,'sawtooth',.04)}}function fire(){if(!en.length)return;let q=en.filter(e=>!e.dead).sort((a,b)=>(a.x-p.x)**2+(a.y-p.y)**2-(b.x-p.x)**2-(b.y-p.y)**2)[0];if(!q)return;let dx=q.x-p.x,dy=q.y-p.y,l=Math.hypot(dx,dy)||1,crit=Math.random()<p.crit;bul.push({x:p.x,y:p.y,vx:dx/l*500,vy:dy/l*500,r:3.5,d:p.dmg*(crit?2:1),life:1.3,crit});tone(520,.02,'square',.008)}function burst(x,y,c='#42e8ff',n=8){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=rand(35,180);fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rand(.2,.55),m:.55,r:rand(1,3),c})}}function hurt(){if(p.shield>t){p.shield=0;toast('SHIELD BROKE');return}p.hp--;shake=12;flash=.55;combo=1;tone(130,.1,'sawtooth',.05);if(p.hp<=0)end();else{p.shield=t+1.2;toast(p.hp+' HP LEFT')}}function kill(e){e.dead=1;kills++;score+=Math.floor(30*combo*p.mult);combo=Math.min(12,combo+.35);comboT=2.2;pulse=Math.min(100,pulse+7);let gain=e.kind==='boss'?55:18;p.xp+=gain;burst(e.x,e.y,e.kind==='boss'?'#ffd166':'#ff4365',e.kind==='boss'?34:10);if(Math.random()<.14||e.kind==='boss'){earned++;orb.push({x:e.x,y:e.y,r:6,l:8})}if(e.kind==='boss'){boss=null;$('boss').classList.remove('show');toast('BOSS DOWN • +1 CORE');pulse=100}if(p.xp>=p.nxp){p.xp-=p.nxp;p.lv++;p.nxp=Math.floor(p.nxp*1.28);levelup()}}function levelup(){paused=1;let choices=[['OVERCHARGE','+30% bolt damage',()=>p.dmg*=1.3],['RAPID CORE','20% faster auto-fire',()=>p.rate*=.8],['PHASE SHELL','Gain a shield',()=>p.shield=t+999],['CRIT GLITCH','+10% critical chance',()=>p.crit+=.1],['PULSE LOOP','Pulse charges 25% faster',()=>p.mult*=1.08],['TRIPLE REPAIR','Restore all HP',()=>p.hp=3]].sort(()=>Math.random()-.5).slice(0,3);let box=$('ups');box.innerHTML='';choices.forEach(c=>{let b=document.createElement('button');b.className='up';b.innerHTML='<b>'+c[0]+'</b><small>'+c[1]+'</small>';b.onclick=()=>{c[2]();$('levelup').style.display='none';paused=0;last=performance.now();tone(720,.08,'triangle',.03);requestAnimationFrame(loop)};box.appendChild(b)});$('levelup').style.display='grid'}$('pulse').onclick=()=>{if(state!=='play'||paused||pulse<100)return;pulse=0;shake=16;flash=.8;tone(90,.22,'sawtooth',.06);en.forEach(e=>{let d=Math.hypot(e.x-p.x,e.y-p.y);if(d<260){e.hp-=e.kind==='boss'?150:999;if(e.hp<=0&&!e.dead)kill(e)}});burst(p.x,p.y,'#7cf7ff',36);toast('PULSE BURST')};$('dash').onclick=()=>{if(state!=='play'||paused||p.dash>t)return;let dx=tx-p.x,dy=ty-p.y,l=Math.hypot(dx,dy)||1;p.x=clamp(p.x+dx/l*120,20,W-20);p.y=clamp(p.y+dy/l*120,80,H-60);p.dash=t+2.4;p.shield=Math.max(p.shield,t+.45);burst(p.x,p.y,'#b884ff',16);shake=6;tone(260,.07,'triangle',.03)};function point(e){let r=C.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}C.addEventListener('pointerdown',e=>{if(state!=='play'||paused)return;drag=1;let q=point(e);tx=q.x;ty=q.y;tone(260,.01,'sine',.001)});C.addEventListener('pointermove',e=>{if(!drag||state!=='play'||paused)return;let q=point(e);tx=q.x;ty=q.y});C.addEventListener('pointerup',()=>drag=0);C.addEventListener('pointercancel',()=>drag=0);function ui(){$('score').textContent=Math.floor(score).toLocaleString();$('lvl').textContent=p.lv;$('pulsebar').style.width=pulse+'%';$('xpbar').style.width=(p.xp/p.nxp*100)+'%';$('combo').textContent='x'+combo.toFixed(1)+' COMBO';$('combo').classList.toggle('on',combo>=2);$('fever').classList.toggle('on',combo>=7);$('pulse').classList.toggle('ready',pulse>=100);$('pulse').textContent=pulse>=100?'PULSE!':'PULSE';$('dash').classList.toggle('ready',p.dash<=t);$('dash').textContent=p.dash<=t?'DASH':Math.max(0,p.dash-t).toFixed(1);if(boss)$('bossbar').style.width=Math.max(0,boss.hp/boss.max*100)+'%'}function update(dt){t+=dt;if(mode==='blitz'&&t>=60)return end();score+=dt*9*combo*p.mult;comboT-=dt;if(comboT<=0)combo=Math.max(1,combo-dt*1.8);pulse=Math.min(100,pulse+dt*(combo>=7?8:4));let ease=1-Math.exp(-p.speed*dt);p.x+=(tx-p.x)*ease;p.y+=(ty-p.y)*ease;p.x=clamp(p.x,16,W-16);p.y=clamp(p.y,70,H-45);p.shot-=dt;if(p.shot<=0){p.shot=p.rate;fire()}spawn-=dt;if(spawn<=0){spawn=Math.max(.18,.88-t*.009);enemy()}if(t>=bossAt&&!boss){bossAt+=28;enemy(1)}for(let e of en){if(e.dead)continue;let dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;if(e.kind==='shooter'&&l<280){e.shoot-=dt;e.x+=dx/l*e.sp*.25*dt;e.y+=dy/l*e.sp*.25*dt;if(e.shoot<=0){e.shoot=rand(1.2,1.9);eb.push({x:e.x,y:e.y,vx:dx/l*220,vy:dy/l*220,r:5,l:3})}}else{let boost=e.kind==='boss'?(1+Math.sin(t*2)*.25):1;e.x+=dx/l*e.sp*boost*dt;e.y+=dy/l*e.sp*boost*dt}if(l<p.r+e.r&&state==='play'){hurt();if(e.kind!=='boss')e.dead=1}}for(let b of bul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of en){if(e.dead||b.dead)continue;if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){e.hp-=b.d;b.de .shadowColor='#42e8ff';let pg=X.createRadialGradient(p.x-4,p.y-5,2,p.x,p.y,p.r*1.2);pg.addColorStop(0,'#fff');pg.addColorStop(.25,'#72f5ff');pg.addColorStop(1,'#2352ff');X.fillStyle=pg;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill();if(p.shield>t){X.strokeStyle='#7cf7b7';X.lineWidth=2;X.beginPath();X.arc(p.x,p.y,p.r+7,0,7);X.stroke()}X.shadowBlur=0;for(let f of fx){X.globalAlpha=Math.max(0,f.l/f.m);X.fillStyle=f.c;X.beginPath();X.arc(f.x,f.y,f.r,0,7);X.fill()}X.globalAlpha=1;X.restore();if(flash){X.fillStyle='rgba(190,245,255,'+(flash*.28)+')';X.fillRect(0,0,W,H)}}function loop(now){if(state!=='play'||paused)return;let dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);draw();if(state==='play'&&!paused)requestAnimationFrame(loop)}document.addEventListener('visibilitychange',()=>{if(state==='play'){paused=document.hidden;if(!paused){last=performance.now();requestAnimationFrame(loop)}}});reset();draw()})();
